services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: luminary-postgres
    environment:
      POSTGRES_DB: luminary
      POSTGRES_USER: luminary
      POSTGRES_PASSWORD: luminary
    ports:
      - "5433:5432"
    volumes:
      - luminary-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luminary -d luminary"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: luminary-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  luminary-pgdata: